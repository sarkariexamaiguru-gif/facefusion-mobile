name: build-apk
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Upstream release tag to take the prebuilt native libraries from"
        required: true
        default: "v0.9.41"
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        run: |
          set -eux
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -sSL -o /tmp/cmdline.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Install SDK packages
        run: |
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null 2>&1 || true
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" "platforms;android-35" "build-tools;34.0.0" "platform-tools"
      - name: Fetch prebuilt native libraries from the release APK
        env:
          REL: ${{ inputs.release_tag }}
        run: |
          set -eux
          APK="facefusion-mobile-${REL#v}-release.apk"
          curl -sSL -o /tmp/rel.apk "https://github.com/AbrahamPaulJ/facefusion-mobile/releases/download/${REL}/${APK}"
          rm -rf /tmp/x && mkdir -p /tmp/x
          ( cd /tmp/x && unzip -o -j /tmp/rel.apk 'lib/arm64-v8a/*' )
          mkdir -p pn/arm64-v8a
          cp /tmp/x/libffnative.so /tmp/x/libc++_shared.so pn/arm64-v8a/
          mkdir -p work/android/app/src/main/jniLibs/arm64-v8a
          cp /tmp/x/libQnn*.so work/android/app/src/main/jniLibs/arm64-v8a/
          mkdir -p work/android/app/src/main/cpp/include/QNN
          : > work/android/app/src/main/cpp/include/QNN/QnnBackend.h
      - name: Build release APK
        run: |
          cd work/android
          chmod +x gradlew
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties
          ./gradlew :app:assembleRelease -PprebuiltNativeDir="$GITHUB_WORKSPACE/pn"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: facefusion-apk-unsigned
          path: work/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
